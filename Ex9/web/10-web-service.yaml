# This is the one Service exposed outside the cluster. NodePort works
# everywhere (minikube/kind/bare metal); on a cloud cluster you'd normally
# switch type to LoadBalancer to get a real external IP, or front it with
# an Ingress instead.
apiVersion: v1
kind: Service
metadata:
  name: person-web
  namespace: person-app
spec:
  type: NodePort
  selector:
    app: person-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30087   # reachable at http://<any-node-ip>:30080
      name: http
