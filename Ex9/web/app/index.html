<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Person Directory</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
  input { margin: 4px 4px 4px 0; padding: 6px; }
  button { padding: 6px 14px; cursor: pointer; }
  #status { color: #a00; margin-top: 8px; }
</style>
</head>
<body>
  <h1>Person Directory</h1>
  <p>Frontend pod &rarr; calls the API pod (<code>/api/persons</code>) &rarr; which reads/writes MySQL.</p>

  <form id="addForm">
    <input id="first_name" placeholder="First name" required />
    <input id="last_name" placeholder="Last name" required />
    <input id="email" placeholder="Email" />
    <button type="submit">Add person</button>
  </form>
  <div id="status"></div>

  <table>
    <thead><tr><th>ID</th><th>First</th><th>Last</th><th>Email</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

<script>
  // Nginx (see nginx.conf) reverse-proxies "/api/" to the person-api Service,
  // so the browser only ever talks to this same origin.
  const API_BASE = '/api/persons';

  async function loadPersons() {
    const res = await fetch(API_BASE);
    const data = await res.json();
    const rows = document.getElementById('rows');
    rows.innerHTML = '';
    data.forEach(p => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${p.id}</td><td>${p.first_name}</td><td>${p.last_name}</td><td>${p.email || ''}</td>
        <td><button onclick="deletePerson(${p.id})">Delete</button></td>`;
      rows.appendChild(tr);
    });
  }

  async function deletePerson(id) {
    await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
    loadPersons();
  }

  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = {
      first_name: document.getElementById('first_name').value,
      last_name: document.getElementById('last_name').value,
      email: document.getElementById('email').value,
    };
    const statusEl = document.getElementById('status');
    try {
      const res = await fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error(await res.text());
      statusEl.textContent = '';
      e.target.reset();
      loadPersons();
    } catch (err) {
      statusEl.textContent = 'Error: ' + err.message;
    }
  });

  loadPersons();
</script>
</body>
</html>
