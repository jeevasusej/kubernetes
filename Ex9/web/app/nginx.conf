server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy browser calls to the API's ClusterIP Service.
    # "person-api" resolves via cluster DNS because both pods live in the
    # same "person-app" namespace.
    location /api/ {
        proxy_pass http://person-api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
