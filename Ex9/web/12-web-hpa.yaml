apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: person-web-hpa
  namespace: person-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: person-web
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
