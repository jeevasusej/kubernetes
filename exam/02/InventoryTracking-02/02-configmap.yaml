apiVersion: v1
kind: ConfigMap
metadata:
  name: inventorytracking-02-config
  namespace: inventory02-ns
data:
  # --- Snipe-IT application settings ---
  APP_URL: "http://inventorytracking02.local/web"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_TIMEZONE: "UTC"
  APP_LOCALE: "en"
  PHP_TIMEZONE: "UTC"
  APP_TRUSTED_PROXIES: "*"

  # --- Database connection settings (shared by app + db containers) ---
  DB_CONNECTION: "mysql"
  DB_HOST: "inventorytracking-02-db-svc"
  DB_PORT: "3306"
  DB_DATABASE: "snipeit"
  DB_USERNAME: "snipeit"
  DB_PREFIX: ""
  MYSQL_DATABASE: "snipeit"
  MYSQL_USER: "snipeit"
