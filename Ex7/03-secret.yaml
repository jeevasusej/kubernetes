# Secret = like a ConfigMap, but intended for sensitive data (passwords,
# tokens, certs). Kubernetes stores/transmits Secret data base64-encoded and,
# unlike a ConfigMap, automatically base64-DECODES it when injected into a Pod
# via secretKeyRef/envFrom — a Pod reading APP_PASSWORD gets the literal text
# "password", not "cGFzc3dvcmQ=". Note: base64 is an *encoding*, not
# encryption — a Secret is not confidential by itself unless the cluster has
# encryption-at-rest configured.
#
# Two ways to author the values below (never put the same key in both):
#   `data`       — values must already be base64-encoded (APP_USERNAME/APP_PASSWORD).
#   `stringData` — plain-text values; Kubernetes base64-encodes them for you on
#                  write (APP_USERNAME1/APP_PASSWORD1).
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: ex7
type: Opaque
data:
  APP_USERNAME: YWRtaW4=
  APP_PASSWORD: cGFzc3dvcmQ=
stringData:
  APP_USERNAME1: username1
  APP_PASSWORD1: password1
