apiVersion: v1
kind: Pod
metadata:
 name: checkout-web
 namespace: ex7
 labels:
   app: checkout-web
spec:
 containers:
   - name: nginx
     image: nginx
     ports:
       - containerPort: 80
     command: ["sh", "-c",
       "(sleep 15 && touch /tmp/healthy) & nginx -g 'daemon off;'"]
     readinessProbe:
       exec:
         command: ["cat", "/tmp/healthy"]
       initialDelaySeconds: 2
       periodSeconds: 3
     livenessProbe:
       httpGet:
         path: /
         port: 80
       initialDelaySeconds: 20
       periodSeconds: 5
       failureThreshold: 3