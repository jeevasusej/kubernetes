apiVersion: v1
kind: Pod
metadata:
  name: report-pvc-demo
  namespace: ex7
spec:
  volumes:
    - name: report-data
      persistentVolumeClaim:
        claimName: ke3-pv-claim

  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Report stored in PVC at $(date)' >> /data/report.txt; sleep 3600"]
      volumeMounts:
        - name: report-data
          mountPath: /data

    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 5; cat /data/report.txt; sleep 3600"]
      volumeMounts:
        - name: report-data
          mountPath: /data