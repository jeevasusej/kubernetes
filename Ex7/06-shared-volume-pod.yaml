apiVersion: v1
kind: Pod
metadata:
  name: report-volume-demo
  namespace: ex7
  labels:
    app: report-volume-demo
spec:
  volumes:
    - name: report-data
      emptyDir: {}

  containers:
    - name: writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - echo "Report generated at $(date)" > /data/report.txt; sleep 3600
      volumeMounts:
        - name: report-data
          mountPath: /data

    - name: reader
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 5; cat /data/report.txt; sleep 3600
      volumeMounts:
        - name: report-data
          mountPath: /data