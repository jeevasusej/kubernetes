server {
    listen 80;
    server_name _;

    # Simple health check - fixed JSON body, no static file needed.
    location = /status {
        default_type application/json;
        return 200 '{"status":"UP","service":"InventoryTracking"}';
    }

    # Exact /web serves the dashboard directly - HTTP 200, no redirect.
    location = /web {
        root /usr/share/nginx/html;
        default_type text/html;
        try_files /index.html =404;
    }

    # /web/<asset> (and /web/ itself) serve everything else from the same
    # folder. index.html links to assets with absolute /web/... paths so
    # they resolve the same way whether the page was loaded as /web or /web/.
    location /web/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /web/index.html;
    }

    location = / {
        return 302 /web;
    }
}
