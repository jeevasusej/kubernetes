# 1. Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: ex8

---
# 2. ServiceAccounts (the identities)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ex8-dev-viewer
  namespace: ex8

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ex8-dev-writer
  namespace: ex8

---
# 3. Roles (the permissions)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ex8-pod-reader
  namespace: ex8
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ex8-pod-writer
  namespace: ex8
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services"]
    verbs: ["get", "list", "watch", "delete"]

---
# 4. RoleBindings (the glue)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ex8-dev-viewer-binding
  namespace: ex8
subjects:
  - kind: ServiceAccount
    name: ex8-dev-viewer
    namespace: ex8
roleRef:
  kind: Role
  name: ex8-pod-reader
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ex8-dev-writer-binding
  namespace: ex8
subjects:
  - kind: ServiceAccount
    name: ex8-dev-writer
    namespace: ex8
roleRef:
  kind: Role
  name: ex8-pod-writer
  apiGroup: rbac.authorization.k8s.io

---
# 5. Deployment (the workload the Roles govern access to)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ex8-hello-microservice
  namespace: ex8
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ex8-hello-microservice
  template:
    metadata:
      labels:
        app: ex8-hello-microservice
    spec:
      containers:
        - name: ex8-hello-microservice
          image: 092304627145.dkr.ecr.eu-north-1.amazonaws.com/sample-node-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"

---
# 6. Service (exposes hello-microservice; also what the Roles' "services" grant applies to)
apiVersion: v1
kind: Service
metadata:
  name: ex8-hello-microservice
  namespace: ex8
spec:
  type: NodePort
  selector:
    app: ex8-hello-microservice
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30081
